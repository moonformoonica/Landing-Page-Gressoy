    <meta charset="UTF-8" />

      Gressoy Indonesia - Susu Kedelai & Plant Based Dessert Pertama di Purwokerto

    <!-- Open Graph (preview link WhatsApp/Facebook/LINE/Telegram) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gressoy Indonesia" />
    <meta
      property="og:title"
      content="Gressoy Indonesia - Susu Kedelai & Plant Based Dessert Pertama di Purwokerto"
    />

    />
    <!--
      Banner pratinjau link: maskot Gressoy di atas gradasi hijau brand.

      Dua syarat yang dua-duanya wajib, dan pernah bikin pratinjaunya gagal:
      1. Ukuran 1200x630 (rasio 1,91:1). Favicon 512x512 yang persegi membuat
         semua platform jatuh ke mode kartu kecil — gambarnya cuma jadi
         thumbnail mungil di samping judul, bukan banner.
      2. Berkasnya harus ringan. Versi PNG-nya 324 KB dan WhatsApp diam saja
         (tidak menampilkan apa pun); di atas ~300 KB pratinjaunya memang
         sering gagal ditarik. Versi JPEG ini 44 KB.
      Jadi kalau banner diganti, jaga dua-duanya: tetap 1200x630 DAN di bawah
      ~300 KB.
    -->
    <meta
      property="og:image"
      content="https://gressoyindonesia.vercel.app/og-banner.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta
      property="og:image:alt"
      content="Maskot Gressoy memeluk botol-botol susu kedelai GresSOY"
    />
    <meta property="og:url" content="https://gressoyindonesia.vercel.app/" />
    <meta property="og:locale" content="id_ID" />

    <!-- Twitter Card -->
    <!-- summary_large_image: kartu dengan gambar lebar. Kalau tetap "summary",
         X/Twitter memaksa thumbnail kecil walau gambarnya sudah 1200x630. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Gressoy Indonesia - Susu Kedelai & Plant Based Dessert Pertama di Purwokerto"

    />
    <meta
      name="twitter:image"
      content="https://gressoyindonesia.vercel.app/og-banner.jpg"
    />
